# Local MeshCore diagnostics (SAFE EXAMPLE — no production credentials)
#
# This is a configuration *snippet*, not a replacement for your bot config.ini.
# Copy relevant options into /opt/meshcore-bot/local/config.ini (one section
# header only for each section), or merge into the active bot config.
# NEVER commit production config.ini, local/config.ini, keys, passwords,
# private node locations, private MQTT credentials, or radio IP addresses.

[Neighborlist_Command]
enabled = true
# neighbourlist is admin-only in Python code (regardless of admin_commands)

[Heardme_Command]
enabled = true
channels =

[Linktrend_Command]
enabled = true
channels =

[Help_Command]
enabled = true

# OPTIONAL: setting [Keywords] help replaces the built-in dynamic help list.
# Keep this short enough to fit one 158-byte direct message.
# Only enable this if you want these commands guaranteed to appear in !help.
# [Keywords]
# help = Bot: ping, heardme(DM), linktrend(DM), neighborlist(DM), neighbors(DM), path, trace, stats | help <command>

# Your *private* production config must already contain [Stats_Command]
# collect_stats = true and track_all_messages = true for heardme history.
# [PacketCapture] neighbors_enabled = true stores linktrend observations.
# Do not add admin_commands = heardme,linktrend: they're for community DMs.
