# PUBLIC EXAMPLE ONLY — use in /opt/meshcore-bot/local/config.ini.
# The original bot config.ini loads first; local/config.ini overrides matching
# keys. Merge the section bodies when your local config already has a section.
# Never commit the active config, public/private identity keys, tokens, passwords,
# internal IPs, location coordinates, or custom private channel names.
# For a complete sanitized upstream-style config see /config.ini.diagnostics.

# Built-in !ping already exists, so an ordinary local/commands/ping.py would
# be skipped. Use upstream's supported alternative-plugin override instead.
[Plugin_Overrides]
ping = ping_diagnostics

[Ping_Command]
enabled = true
# DM: @[sender] hop count, SNR, and known route repeater names.
# Unknown/ambiguous prefix names display as n/a.
# !pingplain preserves the original [Keywords] ping response.

[Neighborlist_Command]
enabled = true
# Administrative only by the plugin itself (requires_admin_access=True).

[Heardme_Command]
enabled = true
channels =

[Linktrend_Command]
enabled = true
channels =

[Mypaths_Command]
enabled = true
channels =

[Traffic_Command]
enabled = true
channels =

[Airtime_Command]
enabled = true
channels =
# IMPORTANT: Defaults below are EXAMPLES ONLY. Set to your actual modem profile.
# Airtime does not automatically read LoRa radio parameters.
default_sf = 7
default_bw_khz = 62.5
default_cr_denominator = 5
default_preamble_symbols = 32
default_transmissions = 1

[Help_Command]
enabled = true

# [Keywords] help overrides dynamic help! Only enable if you want a fixed list.
# Place help = ... inside your EXISTING [Keywords] section; do not duplicate it.
# [Keywords]
# help = Bot: ping, heardme, mypaths, traffic, airtime, linktrend, neighborlist, neighbors, path, trace | help <command>

# Required for !heardme and !mypaths historical reports:
# [Stats_Command]
# collect_stats = true
# track_all_messages = true
# anonymize_users = false   # if true, mypaths uses the same upstream name hash
#
# Required to populate !linktrend / !neighborlist stored direct-neighbor data:
# [PacketCapture]
# neighbors_enabled = true
# neighbors_interval_hours = 24
#
# !traffic needs the bot's web-viewer integration to write packet_stream
# to [Bot] db_path. No remote MQTT service is required for traffic statistics.
[Bots_Command]
enabled = true
channels = #test
# !bots or !bots list: compact entries (index, +/*/?, 4-hex key prefix, km).
# !bots page 2: next page; !bots1 or !bots info 1: node details.
# +: replies to 2+ distinct commands; *: 1; ?: name-only candidate.
# Four-character key prefixes expand on collisions; unlinked replies show ----.
# Distance is straight-line from [Bot] bot_latitude/bot_longitude to
# latest valid complete_contact_tracking GPS fix; missing data shows n/a.
# Command replies must match a recent public request in the SAME channel.
# Passive only; no automatic pings, path requests or other RF scans.
reply_window_seconds = 45
evidence_retention_days = 30

# To observe command responses, keep the upstream stats recorder active:
# [Stats_Command]
# enabled = true
# collect_stats = true
# track_all_messages = true
# anonymize_users = false
# If anonymize_users=true, sender names can't be correlated.
# Only observed, decrypted PUBLIC channel messages can count.
# Replies to DMs between other users cannot be observed by your bot.


[Rneighbors_Command]
# Admin DM ONLY: explicitly selected remote repeaters. Disabled by default.
# Add full 64-character public keys only to your PRIVATE active config.
# The public repository intentionally contains no personal repeater keys.
enabled = false
# Syntax alias=FULL_PUBLIC_KEY, alias2=FULL_PUBLIC_KEY
repeaters =
# !rneighbors ALIAS reads saved data. Only refresh sends a remote request.
# Each refresh fetches just one bounded remote neighbour table page.
request_count = 12
