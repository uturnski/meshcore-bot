# PUBLIC EXAMPLE ONLY — use in /opt/meshcore-bot/local/config.ini.
# The original bot config.ini loads first; local/config.ini overrides matching
# keys. Merge the section bodies when your local config already has a section.
# Never commit the active config, public/private identity keys, tokens, passwords,
# internal IPs, location coordinates, or custom private channel names.
# For a complete sanitized upstream-style config see /config.ini.diagnostics.

[Neighborlist_Command]
enabled = true
# Administrative only by the plugin itself (requires_admin_access=True).

[Heardme_Command]
enabled = true
channels =

[Linktrend_Command]
enabled = true
channels =

[Mypaths_Command]
enabled = true
channels =

[Traffic_Command]
enabled = true
channels =

[Airtime_Command]
enabled = true
channels =
# IMPORTANT: Defaults below are EXAMPLES ONLY. Set to your actual modem profile.
# Airtime does not automatically read LoRa radio parameters.
default_sf = 7
default_bw_khz = 62.5
default_cr_denominator = 5
default_preamble_symbols = 32
default_transmissions = 1

[Help_Command]
enabled = true

# [Keywords] help overrides dynamic help! Only enable if you want a fixed list.
# Place help = ... inside your EXISTING [Keywords] section; do not duplicate it.
# [Keywords]
# help = Bot: ping, heardme, mypaths, traffic, airtime, linktrend, neighborlist, neighbors, path, trace | help <command>

# Required for !heardme and !mypaths historical reports:
# [Stats_Command]
# collect_stats = true
# track_all_messages = true
# anonymize_users = false   # if true, mypaths uses the same upstream name hash
#
# Required to populate !linktrend / !neighborlist stored direct-neighbor data:
# [PacketCapture]
# neighbors_enabled = true
# neighbors_interval_hours = 24
#
# !traffic needs the bot's web-viewer integration to write packet_stream
# to [Bot] db_path. No remote MQTT service is required for traffic statistics.